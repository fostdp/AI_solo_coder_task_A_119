<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古代天平衡器精度检定与误差分析系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>古代天平衡器精度检定与误差分析系统</h1>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="stat-label">天平总数</span>
                    <span class="stat-value" id="totalBalances">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">活动告警</span>
                    <span class="stat-value alert-value" id="activeAlerts">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">24h测量</span>
                    <span class="stat-value" id="recentMeasurements">0</span>
                </div>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>天平列表</h3>
                    <div class="balance-list" id="balanceList">
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>筛选</h3>
                    <select id="dynastyFilter">
                        <option value="">全部朝代</option>
                    </select>
                    <select id="typeFilter">
                        <option value="">全部类型</option>
                        <option value="EQUAL_ARM">等臂天平</option>
                        <option value="UNEQUAL_ARM">不等臂天平</option>
                    </select>
                </div>

                <div class="sidebar-section">
                    <h3>分析功能</h3>
                    <button class="btn btn-primary" id="btnErrorAnalysis">误差分析(蒙特卡洛)</button>
                    <button class="btn btn-secondary" id="btnWeightSystem">权衡制度分析</button>
                </div>
            </aside>

            <main class="content-area">
                <div class="viewer-container">
                    <div class="viewer-header">
                        <h2 id="currentBalanceName">请选择天平查看三维模型</h2>
                        <div class="viewer-controls">
                            <button class="btn-icon" id="btnRotate" title="自动旋转">
                                ⟳
                            </button>
                            <button class="btn-icon" id="btnReset" title="重置视角">
                                ⌂
                            </button>
                        </div>
                    </div>
                    <div id="threeCanvas" class="three-canvas"></div>
                    <div class="viewer-legend">
                        <div class="legend-item">
                            <span class="legend-color beam-highlight"></span>
                            <span>横梁</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color knife-highlight"></span>
                            <span>刀口</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color pan"></span>
                            <span>秤盘</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color pillar"></span>
                            <span>立柱</span>
                        </div>
                    </div>
                </div>

                <div class="detail-panel">
                    <div class="detail-tabs">
                        <button class="tab-btn active" data-tab="info">基本信息</button>
                        <button class="tab-btn" data-tab="error">误差曲线</button>
                        <button class="tab-btn" data-tab="analysis">精度分析</button>
                        <button class="tab-btn" data-tab="alerts">告警记录</button>
                    </div>

                    <div class="tab-content active" id="tab-info">
                        <div class="info-grid">
                            <div class="info-item">
                                <label>天平编号</label>
                                <span id="infoCode">-</span>
                            </div>
                            <div class="info-item">
                                <label>类型</label>
                                <span id="infoType">-</span>
                            </div>
                            <div class="info-item">
                                <label>朝代</label>
                                <span id="infoDynasty">-</span>
                            </div>
                            <div class="info-item">
                                <label>最大称量</label>
                                <span id="infoCapacity">-</span>
                            </div>
                            <div class="info-item">
                                <label>左臂长度</label>
                                <span id="infoLeftArm">-</span>
                            </div>
                            <div class="info-item">
                                <label>右臂长度</label>
                                <span id="infoRightArm">-</span>
                            </div>
                            <div class="info-item">
                                <label>刀口半径</label>
                                <span id="infoKnife">-</span>
                            </div>
                            <div class="info-item">
                                <label>精度等级</label>
                                <span id="infoGrade">-</span>
                            </div>
                            <div class="info-item full-width">
                                <label>出土地点</label>
                                <span id="infoLocation">-</span>
                            </div>
                            <div class="info-item full-width">
                                <label>描述</label>
                                <span id="infoDesc">-</span>
                            </div>
                        </div>
                    </div>

                    <div class="tab-content" id="tab-error">
                        <div class="chart-container">
                            <canvas id="errorChart"></canvas>
                        </div>
                        <div class="chart-stats">
                            <div class="stat-box">
                                <span class="stat-box-label">平均误差</span>
                                <span class="stat-box-value" id="avgError">-</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-box-label">标准差</span>
                                <span class="stat-box-value" id="stdDev">-</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-box-label">最大误差</span>
                                <span class="stat-box-value" id="maxError">-</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-box-label">测量次数</span>
                                <span class="stat-box-value" id="measureCount">-</span>
                            </div>
                        </div>
                    </div>

                    <div class="tab-content" id="tab-analysis">
                        <div class="analysis-result" id="analysisResult">
                            <p class="placeholder-text">点击"误差分析(蒙特卡洛)"按钮进行分析</p>
                        </div>
                    </div>

                    <div class="tab-content" id="tab-alerts">
                        <div class="alert-list" id="alertList">
                            <p class="placeholder-text">暂无告警记录</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div class="alert-banner" id="alertBanner" style="display: none;">
            <span class="alert-icon">⚠</span>
            <span class="alert-message" id="alertMessage">新的告警</span>
            <button class="alert-close" onclick="document.getElementById('alertBanner').style.display='none'">×</button>
        </div>
    </div>

    <div class="modal" id="weightSystemModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>古代权衡制度分析</h2>
                <button class="modal-close" onclick="closeModal('weightSystemModal')">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-controls">
                    <select id="wsDynasty">
                        <option value="">全部朝代</option>
                    </select>
                    <button class="btn btn-primary" id="btnRunWS">运行分析</button>
                </div>
                <div class="ws-result" id="wsResult">
                    <p class="placeholder-text">选择朝代并点击"运行分析"开始聚类分析</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.2/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/dist/stomp.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/balance3d.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/metrology_panel.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
